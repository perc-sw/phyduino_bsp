# On a version tag (e.g. v0.1.0): compile everything, build the platform zip and
# package index, and publish both as GitHub Release assets.
# Board Manager URL for users (always the newest release):
#   https://github.com/<owner>/<repo>/releases/latest/download/package_phyduino_index.json
# A tag with a suffix (e.g. v0.1.0-alpha.1) is published as a pre-release, which
# releases/latest skips; test it with releases/download/<tag>/package_phyduino_index.json
# Recipe: docs/maintenance/release.html
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04  # pinned; change deliberately (ubuntu-latest moves to 26.04 on 2026-10-19)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build

      - name: Check tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"

      - name: Compile sketches
        run: python3 tests/compile_all.py --config-file "$ARDUINO_CLI_CONFIG"

      - name: Fetch previous index (keeps older versions installable)
        run: gh release download --pattern package_phyduino_index.json --output previous_index.json || true

      - name: Build release
        run: python3 package/make_release.py --repo "$GITHUB_REPOSITORY" --previous-index previous_index.json

      # Re-packed tool archives (see package/tools.json "host_tag") are published
      # once, on their own release; later releases reuse them.
      - name: Publish re-packed tools (first time only)
        run: |
          for tag in $(python3 -c "import json; print(' '.join(t['host_tag'] for t in json.load(open('package/tools.json'))['tools'] if 'host_tag' in t))"); do
            if ls package/build/tools/*.zip > /dev/null 2>&1 && ! gh release view "$tag" > /dev/null 2>&1; then
              gh release create "$tag" package/build/tools/*.zip --title "$tag" --latest=false \
                --notes "Toolchain re-packed for the Arduino Board Manager (single root folder). Unmodified contents."
            fi
          done

      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) kind="--prerelease" ;;
            *)   kind="--latest" ;;
          esac
          gh release create "$GITHUB_REF_NAME" $kind \
            package/build/phyduino-rp2-*.zip \
            package/build/package_phyduino_index.json \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md"

      # docs/index.html is the students' install page: point its Board Manager URL
      # and version pill at this release and commit that to main. A pre-release
      # gets its own URL because releases/latest skips pre-releases.
      - name: Update install page
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) path="download/$GITHUB_REF_NAME" ;;
            *)   path="latest/download" ;;
          esac
          git fetch origin main
          git checkout -B main origin/main
          sed -i -E \
            -e "s#releases/[^\"<]*/package_phyduino_index\.json#releases/$path/package_phyduino_index.json#" \
            -e "s#<span class=\"spec-pill\">v[0-9][^<]*</span>#<span class=\"spec-pill\">$GITHUB_REF_NAME</span>#" \
            docs/index.html
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898898+github-actions[bot]@users.noreply.github.com"
          git commit -am "Point install page at $GITHUB_REF_NAME"
          git push origin main

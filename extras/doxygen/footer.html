<script type="text/javascript">
// Example pages: Doxygen titles them with the file name (AnalogMillivolts.ino).
// Show the title from the hidden example-title span in extras/doxygen/examples.dox.
(function () {
  const name = document.querySelector('.contents .example-title');
  const title = document.querySelector('.headertitle .title');
  if (name && title) title.textContent = name.textContent;
})();
</script>

<script type="text/javascript">
// Short pages: stretch the content so the footer sits at the bottom of the window.
// Plain CSS can't do this here, because a flex layout would break the floated side bar.
(function () {
  function fitFooter() {
    const container = document.getElementById('container');
    const footer = document.querySelector('.site-footer');
    if (!container || !footer) return;
    container.style.minHeight = '';
    const navPath = document.getElementById('nav-path');
    const footerMargin = parseFloat(getComputedStyle(footer).marginTop) || 0;
    const below = (navPath ? navPath.offsetHeight : 0) + footer.offsetHeight + footerMargin;
    const space = window.innerHeight - container.getBoundingClientRect().top - window.scrollY - below;
    if (space > container.offsetHeight) container.style.minHeight = space + 'px';
  }
  window.addEventListener('load', fitFooter);
  window.addEventListener('resize', fitFooter);
})();
</script>

<script type="text/javascript">
// "On this page" panel. Doxygen's own code expects #doc-content to scroll, but
// uoft_doxygen.css makes the whole page scroll, so the panel's links and its
// highlight of the sections in view are handled here instead.
(function () {
  // Doxygen scrolls a heading's row or title rather than the bare anchor
  function scrollTargetFor(anchor) {
    const parent = anchor.parentElement;
    if (parent && (parent.matches('td.memItemLeft, div.memtitle, td.fieldname, td.fieldtype') ||
                   /^H[1-6]$/.test(parent.tagName))) {
      return parent;
    }
    return anchor;
  }

  // Runs before Doxygen's handler on the link, which would scroll #doc-content
  document.addEventListener('click', function (e) {
    const link = e.target.closest('ul.page-outline a[href^="#"]');
    if (!link) return;
    const anchor = document.getElementById(link.getAttribute('href').slice(1));
    if (!anchor) return;
    e.preventDefault();
    e.stopPropagation();
    scrollTargetFor(anchor).scrollIntoView({ behavior: 'smooth', block: 'start' });
    history.pushState(null, '', link.getAttribute('href'));
  }, true);

  // Marks the panel entries whose sections are in the window (class "vis")
  function highlight() {
    const content = document.getElementById('doc-content');
    const items = document.querySelectorAll('ul.page-outline li[id^="nav-"]');
    if (!content || items.length === 0) return;

    const box = content.getBoundingClientRect();
    const viewTop = Math.max(0, box.top);
    const viewBottom = Math.min(window.innerHeight, box.bottom);
    const margin = 10;  // pixels of a section that must show, as in Doxygen

    const sections = [];
    items.forEach(function (item) {
      const heading = document.getElementById(item.id.slice(4));
      if (!heading) return;
      const start = heading.parentElement && heading.parentElement.classList.contains('doxsection')
                        ? heading.parentElement : heading;
      sections.push({ item: item, top: start.getBoundingClientRect().top });
    });

    let first = null;
    sections.forEach(function (section, i) {
      const bottom = i + 1 < sections.length ? sections[i + 1].top : box.bottom;
      const visible = section.top < viewBottom - margin && bottom > viewTop + margin;
      section.item.classList.toggle('vis', visible);
      if (visible && !first) first = section.item;
    });

    // Keep the first highlighted entry in view when the panel is taller than the window
    const panel = document.getElementById('page-nav');
    if (first && panel) {
      const p = panel.getBoundingClientRect();
      const f = first.getBoundingClientRect();
      if (f.top < p.top || f.bottom > p.bottom) panel.scrollTop += f.top - p.top - p.height / 3;
    }
  }

  // Doxygen marks every entry once after load and on resize; run after it
  window.addEventListener('scroll', highlight, { passive: true });
  window.addEventListener('resize', function () { setTimeout(highlight, 0); });
  window.addEventListener('load', function () { setTimeout(highlight, 300); });
})();
</script>

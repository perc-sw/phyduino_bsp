sentence=Examples for the Phyduino board features built into the core.
paragraph=Analog: millivolts, averaging, differential, several pins at once, and fixed-rate bursts on every analog pin. USB-PD: power profiles, charger contract and VBUS. Multicore: setup1()/loop1() and rp2040.fifo. FreeRTOS (Tools > Operating System > FreeRTOS): tasks and queues. CMSIS-RTOS2 (Tools > Operating System > FreeRTOS + CMSIS-RTOS2): threads and message queues. The analog and multicore functions are part of the core, so no #include is needed; USB-PD needs #include <stusb4500.h>, FreeRTOS its own headers, CMSIS-RTOS2 #include <cmsis_os2.h>.
